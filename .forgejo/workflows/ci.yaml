name: CI, Quality & GitOps Cascade

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check-and-test:
    name: "Rust — Checks, Tests & Quality Gates"
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/gost-ci-cross:latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Rust Toolchain"
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
          rustup component add rustfmt clippy 2>/dev/null || true

      - name: "Configure Sovereign Cargo Registries"
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GAMBI_2LP_IN_TOKEN || secrets.FORGEJO_TOKEN }}
        run: |
          mkdir -p "$HOME/.cargo"
          printf '[registries.gambi]\nindex = "sparse+https://gambi.2lp.in/api/packages/lumen/cargo/"\n' > "$HOME/.cargo/config.toml"
          if [ -n "$TOKEN" ]; then
            printf '[registries.gambi]\ntoken = "%s"\n' "$TOKEN" > "$HOME/.cargo/credentials.toml"
          fi

      - name: "GitOps — Update Sovereign Satellite Dependencies"
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "-> GitOps dispatch recebido: atualizando joaju-csv a partir do registry gambi..."
          cargo update -p joaju-csv || cargo update
          if ! git diff --quiet Cargo.lock; then
            echo "-> Alteracoes detectadas em Cargo.lock. Commitando..."
            git config user.name "Lumen Pink (Baquara)"
            git config user.email "hi@lumen.pink"
            git commit -m "chore(deps): atualizar joaju-csv do registry gambi [skip ci]"
            if [ -n "${{ secrets.CODEBERG_TOKEN }}" ]; then
              git push "https://x-access-token:${{ secrets.CODEBERG_TOKEN }}@codeberg.org/lumenpink/joaju-pedigree.git" main || true
            fi
          else
            echo "-> Nenhuma alteracao em Cargo.lock detectada."
          fi

      - name: "Format Check"
        run: cargo fmt --check

      - name: "Clippy Check (Zero Warnings)"
        run: cargo clippy --all-targets -- -D warnings

      - name: "Run Unit & Integration Tests"
        run: cargo test

      - name: "Audit GitOps Cascade Integration"
        run: bash tests/audit_gitops_cascade.sh

      - name: "CCCP Quality Audit"
        run: |
          if command -v cccp >/dev/null 2>&1; then
            cccp check --strict
          fi

  publish-and-cascade:
    name: "Publish Sovereign Crate & Cascade Downstream"
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/gost-ci-cross:latest
    needs: [check-and-test]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Configure Sovereign Cargo Credentials"
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GAMBI_2LP_IN_TOKEN || secrets.FORGEJO_TOKEN }}
        run: |
          mkdir -p "$HOME/.cargo"
          printf '[registries.gambi]\nindex = "sparse+https://gambi.2lp.in/api/packages/lumen/cargo/"\n' > "$HOME/.cargo/config.toml"
          if [ -z "$TOKEN" ]; then
            echo "::error::Nenhum token soberano configurado (REGISTRY_TOKEN / GAMBI_2LP_IN_TOKEN)."
            exit 1
          fi
          printf '[registries.gambi]\ntoken = "%s"\n' "$TOKEN" > "$HOME/.cargo/credentials.toml"

      - name: "Publish Crate to Sovereign Cargo Registry"
        run: |
          CANONICAL_VERSION=$(head -n 1 VERSION | tr -d ' \r\n')
          echo "-> Sincronizando Cargo.toml para a versao canonica: $CANONICAL_VERSION"
          sed -i "0,/^version = .*/s//version = \"${CANONICAL_VERSION}\"/" Cargo.toml
          echo "-> Publicando joaju-pedigree no registry gambi..."
          cargo publish --registry gambi --allow-dirty

      - name: "Build Multiarch Staticlibs & Publish to Generic Packages"
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GAMBI_2LP_IN_TOKEN || secrets.FORGEJO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Token soberano ausente para publicacao de Generic Packages!"
            exit 1
          fi
          VERSION=$(head -n 1 VERSION | cut -d'+' -f1 | tr -d ' \r\n')
          TARGETS=(
            "x86_64-unknown-linux-musl:libjoaju_pedigree-x86_64-linux.a"
            "aarch64-unknown-linux-musl:libjoaju_pedigree-aarch64-linux.a"
            "x86_64-pc-windows-gnu:libjoaju_pedigree-x86_64-windows.a"
          )

          for ENTRY in "${TARGETS[@]}"; do
            IFS=":" read -r TARGET DEST_NAME <<< "$ENTRY"
            echo "★ Compilando staticlib para $TARGET..."
            cargo zigbuild --release --target "$TARGET" || cargo build --release --target "$TARGET"

            SRC_PATH="target/${TARGET}/release/libjoaju_pedigree.a"
            if [ -f "$SRC_PATH" ]; then
              echo "-> Enviando $DEST_NAME para Generic Packages ($VERSION)..."
              curl -s -f --http1.1 --retry 3 -X PUT \
                -H "Authorization: token $TOKEN" \
                -T "$SRC_PATH" \
                "https://gambi.2lp.in/api/packages/lumen/generic/joaju-pedigree-static/${VERSION}/${DEST_NAME}"
              echo "✔ $DEST_NAME publicado com sucesso."
            else
              echo "::error::Arquivo $SRC_PATH nao encontrado para publicacao!"
              exit 1
            fi
          done

      - name: "GitOps Cascade — Dispatch Downstream joaju"
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          if [ -n "$CODEBERG_TOKEN" ]; then
            echo "-> Notificando consumidor downstream (joaju)..."
            curl -s -X POST \
              -H "Authorization: token $CODEBERG_TOKEN" \
              -H "Content-Type: application/json" \
              "https://codeberg.org/api/v1/repos/lumenpink/joaju/actions/workflows/ci.yaml/dispatches" \
              -d '{"ref": "main"}' || true
            echo "✔ Disparo enviado para joaju com sucesso."
          else
            echo "CODEBERG_TOKEN ausente, pulando disparo downstream."
          fi
