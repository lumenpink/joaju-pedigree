[package]
name = "pedigree-rs"
version = "0.1.0-dev.1"
edition = "2021"
description = "Motor soberano e biblioteca Rust para manipulação de pedigrees, cálculo de parentesco e renderização de heredogramas clínicos conformes com as diretrizes NSGC/ACMG (paridade com pedtools/R)"
license = "Apache-2.0"
repository = "https://codeberg.org/lumenpink/pedigree-rs"
homepage = "https://codeberg.org/lumenpink/pedigree-rs"
documentation = "https://docs.rs/pedigree-rs"
readme = "README.md"
keywords = ["genetics", "pedigree", "kinship", "heredogram", "clinical-genetics"]
categories = ["science", "data-structures", "command-line-utilities"]
authors = ["Lumen Pink <hi@lumen.pink>"]

[dependencies]
ssot-rs = { version = "0.1.0-dev.1", path = "../ssot-rs" }
petgraph = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"], optional = true }

[dev-dependencies]

[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "pedigree-rs"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "pedigree_rs"
path = "src/lib.rs"
