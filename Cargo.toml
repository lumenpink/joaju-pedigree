[package]
name = "pedigreers"
version = "0.1.0-dev.1"
edition = "2021"
description = "Motor soberano e biblioteca Rust para manipulação de pedigrees, cálculo de parentesco e renderização de heredogramas clínicos conformes com as diretrizes NSGC/ACMG (paridade com pedtools/R)"
license = "Apache-2.0"
repository = "https://codeberg.org/lumenpink/pedigreers"
authors = ["Lumen Pink <hi@lumen.pink>"]

[dependencies]
petgraph = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"], optional = true }

[dev-dependencies]

[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "pedigreers"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "pedigreers"
path = "src/lib.rs"
