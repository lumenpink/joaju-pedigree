[package]
name = "joaju-pedigree"
version = "0.2.1"
edition = "2021"
description = "A high-performance Rust library for pedigree modeling, kinship calculation, and clinical pedigree rendering conforming to NSGC/ACMG guidelines (pedtools/R parity)"
license = "Apache-2.0"
repository = "https://codeberg.org/lumenpink/joaju-pedigree"
homepage = "https://codeberg.org/lumenpink/joaju-pedigree"
documentation = "https://docs.rs/joaju-pedigree"
readme = "README.md"
keywords = ["genetics", "pedigree", "kinship", "heredogram", "clinical-genetics"]
categories = ["science", "data-structures", "command-line-utilities"]
authors = ["Lumen Pink <hi@lumen.pink>"]

[dependencies]
joaju-csv = { version = "0.1.0", registry = "gambi" }
petgraph = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
regex = "1"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"], optional = true }

[dev-dependencies]

[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "joaju-pedigree"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "joaju_pedigree"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]
