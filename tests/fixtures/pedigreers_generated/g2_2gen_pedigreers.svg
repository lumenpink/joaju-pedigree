<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280.0 360.0" width="280.0" height="360.0">
  <style>
    .sym { stroke: #000000; stroke-width: 2.2; fill: #ffffff; }
    .sym-aff { stroke: #000000; stroke-width: 2.2; fill: #000000; }
    .kin-line { stroke: #000000; stroke-width: 2.0; stroke-linecap: round; }
    .consanguinity-line { stroke: #000000; stroke-width: 2.0; }
    .deceased-slash { stroke: #000000; stroke-width: 2.2; }
    .proband-arrow { stroke: #000000; stroke-width: 2.2; fill: none; }
    .lbl { font-family: 'Liberation Sans', sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; fill: #222222; }
    .proband-lbl { font-family: 'Liberation Sans', sans-serif; font-size: 13px; font-weight: bold; fill: #000000; }
    .legend-title { font-family: 'Liberation Sans', sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; fill: #333333; }
    .legend-lbl { font-family: 'Liberation Sans', sans-serif; font-size: 11px; text-anchor: middle; fill: #555555; }
  </style>

  <line class="kin-line marriage-line" x1="50.0" y1="50.0" x2="115.0" y2="50.0" />
  <line class="kin-line" x1="82.5" y1="50.0" x2="82.5" y2="90.0" />
  <line class="kin-line" x1="50.0" y1="90.0" x2="180.0" y2="90.0" />
  <line class="kin-line" x1="50.0" y1="90.0" x2="50.0" y2="131.0" />
  <line class="kin-line" x1="115.0" y1="90.0" x2="115.0" y2="131.0" />
