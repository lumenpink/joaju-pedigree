  <circle class="sym-aff" cx="115.0" cy="50.0" r="14" />
  <text class="lbl" x="115.0" y="80.0">2</text>
  <rect class="sym" x="36.0" y="131.0" width="28" height="28" rx="1" />
  <rect x="36.0" y="131.0" width="14" height="28" fill="#000000" />
  <text class="lbl" x="50.0" y="175.0">3</text>
  <circle class="sym-aff" cx="115.0" cy="145.0" r="14" />
  <!-- Probando Seta e Marcador P -->
  <path class="proband-arrow" d="M 83.0 177.0 L 98.0 162.0 M 98.0 162.0 L 91.0 162.0 M 98.0 162.0 L 98.0 169.0" />
  <text class="proband-lbl" x="77.0" y="183.0">P</text>
  <text class="lbl" x="115.0" y="175.0">4</text>
  <rect class="sym" x="166.0" y="131.0" width="28" height="28" rx="1" />
  <text class="lbl" x="180.0" y="175.0">5</text>
  <!-- Card de Legenda Vetorial Integrado -->
  <g class="card-legend">
    <rect x="20.0" y="270.0" width="380.0" height="75.0" rx="6" fill="#fcfcfc" stroke="#cccccc" stroke-width="1.2" />
    <text class="legend-title" x="210.0" y="288.0">LEGENDA CLÍNICA (NSGC/ACMG)</text>
    <line x1="40.0" y1="294.0" x2="380.0" y2="294.0" stroke="#e0e0e0" stroke-width="1" />
